<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 300' width='720' height='300' role='img' aria-label='Charging power available by electrical service' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'><rect width='720' height='300' fill='#fcfcfb'/><text x='24' y='34' font-size='17' font-weight='600' fill='#0b0b0b'>Charging power available by electrical service</text><text x='24' y='56' font-size='13' fill='#52514e'>A battery lets a 200 A service dispense almost four times its own rating.</text><line x1='230.0' y1='80' x2='230.0' y2='262' stroke='#e4e3df'/><text x='230.0' y='280' font-size='11' fill='#52514e' text-anchor='middle'>0 kW</text><line x1='310.0' y1='80' x2='310.0' y2='262' stroke='#e4e3df'/><text x='310.0' y='280' font-size='11' fill='#52514e' text-anchor='middle'>600 kW</text><line x1='390.0' y1='80' x2='390.0' y2='262' stroke='#e4e3df'/><text x='390.0' y='280' font-size='11' fill='#52514e' text-anchor='middle'>1,200 kW</text><line x1='470.0' y1='80' x2='470.0' y2='262' stroke='#e4e3df'/><text x='470.0' y='280' font-size='11' fill='#52514e' text-anchor='middle'>1,800 kW</text><text x='218' y='107' font-size='13' fill='#0b0b0b' text-anchor='end'>208 V single-phase, 120 A</text><rect x='230.0' y='92' width='3.3' height='22' fill='#2a78d6'/><text x='241.328' y='107' font-size='13' fill='#0b0b0b'><tspan font-weight='600'>25 kW</tspan><tspan fill='#52514e'>  Level 2 AC</tspan></text><text x='218' y='153' font-size='13' fill='#0b0b0b' text-anchor='end'>480 V three-phase, 200 A</text><path d='M230.0,138 H248.2 Q252.2,138 252.2,142 V156 Q252.2,160 248.2,160 H230.0 Z' fill='#2a78d6'/><text x='260.1702503368816' y='153' font-size='13' fill='#0b0b0b'><tspan font-weight='600'>166 kW</tspan><tspan fill='#52514e'>  one DC fast charger</tspan></text><text x='218' y='199' font-size='13' fill='#0b0b0b' text-anchor='end'>Same 200 A service + battery</text><path d='M230.0,184 H310.8 Q314.8,184 314.8,188 V202 Q314.8,206 310.8,206 H230.0 Z' fill='#2a78d6'/><text x='322.8012075385722' y='199' font-size='13' fill='#0b0b0b'><tspan font-weight='600'>636 kW</tspan><tspan fill='#52514e'>  for 4 hours a day</tspan></text><text x='218' y='245' font-size='13' fill='#0b0b0b' text-anchor='end'>480 V three-phase, 2,000 A</text><path d='M230.0,230 H447.7 Q451.7,230 451.7,234 V248 Q451.7,252 447.7,252 H230.0 Z' fill='#2a78d6'/><text x='459.7025033688162' y='245' font-size='13' fill='#0b0b0b'><tspan font-weight='600'>1,663 kW</tspan><tspan fill='#52514e'>  eight 200 kW chargers</tspan></text></svg>