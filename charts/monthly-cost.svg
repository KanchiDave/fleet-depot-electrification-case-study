d6'/><text x='259.706405' y='183' font-size='13' font-weight='600' fill='#0b0b0b'>$11,916</text><text x='198' y='233' font-size='13' fill='#0b0b0b' text-anchor='end'>Electric, with charging site</text><rect x='210.0' y='218' width='39.7' height='22' fill='#2a78d6'/><path d='M251.7,218 H422.7 Q426.7,218 426.7,222 V236 Q426.7,240 422.7,240 H251.7 Z' fill='#eb6834'/><text x='434.706405' y='233' font-size='13' font-weight='600' fill='#0b0b0b'>$61,916</text></svg>